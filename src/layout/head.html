<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="aIz8fSMJZZPiEEMvooUi_EuWE4hNWTgqe4mGC4weCK8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>

  <!-- SEO Meta -->
  <meta name="description" content="{{description}}" />
  <meta name="author" content="YanaYacu Clean" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="{{canonical}}" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="YanaYacu Clean" />
  <meta property="og:locale"      content="es_PE" />
  <meta property="og:url"         content="{{canonical}}" />
  <meta property="og:title"       content="{{og_title}}" />
  <meta property="og:description" content="{{og_description}}" />
  <meta property="og:image"       content="https://www.yanayacuclean.com/assets/img/og-image.jpg" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"    content="YanaYacu Clean – productos de limpieza de alta concentración" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="{{og_title}}" />
  <meta name="twitter:description" content="{{og_description}}" />
  <meta name="twitter:image"       content="https://www.yanayacuclean.com/assets/img/og-image.jpg" />

  <!-- Structured data (generated by scripts/build-pages.js) -->
  <script type="application/ld+json">
{{jsonld}}
  </script>

  <!-- Fonts (self-hosted) -->
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/poppins-latin-400-normal.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/poppins-latin-700-normal.woff2" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/fonts.css" />
  <link rel="stylesheet" href="/assets/css/tailwind.css" />
  <link rel="stylesheet" href="/assets/css/nav.css" />
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <link rel="stylesheet" href="/assets/css/sections.css" />
  <style>[x-cloak]{display:none !important}</style>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
</head>
<body class="font-sans bg-white text-navy">
